alert_pct = 80
worktree_idle_days = 7
archive_idle_days = 4
nas_root = "/srv/coldcleaner/archive"
report_dir = "/srv/coldcleaner/reports"
live = ["worktree", "archive"]
reclaim_hosts = ["server-a", "winhost"]
already_compressed_extensions = [".zip", ".gz", ".zst", ".7z", ".jpg", ".jpeg", ".png", ".mp4", ".mov", ".mp3", ".flac", ".gguf", ".safetensors"]

[hosts.server-a]
kind = "posix"
roots = ["~/projects", "~/.t3/worktrees", "~/.codex/worktrees"]
archive = ["~/projects/*/.scratch", "~/projects/*/local"]

[hosts.machost]
kind = "posix"
ssh = "machost"
roots = ["~/REPOS"]
archive = ["~/REPOS/*/.scratch", "~/REPOS/*/local"]

[hosts.winhost-wsl]
kind = "wsl"
ssh = "winhost"
roots = ["~/projects"]
archive = ["~/projects/*/.scratch", "~/projects/*/local"]

[hosts.winhost]
kind = "powershell"
ssh = "winhost"
roots = ['%USERPROFILE%\REPOS']
archive = ['%USERPROFILE%\REPOS\*\.scratch', '%USERPROFILE%\REPOS\*\local']
