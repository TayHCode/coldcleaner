hard_pct = 85
alert_pct = 80
cache_idle_days = 0 # No additional cache inactivity requirement.
compact_idle_days = 0 # No additional compaction inactivity requirement.
worktree_idle_days = 7
archive_idle_days = 4
project_idle_days = 28
nas_cap_gb = 500
nas_root = "~/.local/share/coldcleaner/archive" # Archiving refuses until this is on a NAS or under local_archive_mount.
local_archive_mount = ""
report_dir = "~/.local/state/coldcleaner/reports"
actions_log_mb = 10
compact_weekday = "sun"
live = []
regenerable_paths = ["node_modules", ".venv", "venv", "target", "dist", "build", "__pycache__", ".cache", ".next"]
already_compressed_extensions = [".zip", ".gz", ".zst", ".7z", ".jpg", ".jpeg", ".png", ".mp4", ".mov", ".mp3", ".flac", ".gguf", ".safetensors"]
manual_notes = []

[hosts.local]
kind = "posix"
shared_roots = []
roots = []
archive = []
compact = []
cache = []
cache_tools = [] # Native package-cache cleaners: uv, npm, pnpm, pip, brew. POSIX hosts only; acts only with "cache" in live.

