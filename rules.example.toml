alert_pct = 80
worktree_idle_days = 7
archive_idle_days = 4
nas_root = "~/.local/share/coldcleaner/archive" # Archiving refuses until this is on a NAS or under local_archive_mount.
local_archive_mount = ""
report_dir = "~/.local/state/coldcleaner/reports"
attention_note = "~/.local/state/coldcleaner/attention.md"
memory_store = "~/.local/state/coldvault/preservation" # Receipts that make artifact entries eligible; never cleaned.
actions_log_mb = 10
max_items_per_run = 200 # Per host; a host table may override it.
max_gib_per_run = 100 # Per host; a host table may override it.
live = []
approval = [] # Tiers (worktree, archive) that act only on items approved with coldcleaner approve.
already_compressed_extensions = [".zip", ".gz", ".zst", ".7z", ".jpg", ".jpeg", ".png", ".mp4", ".mov", ".mp3", ".flac", ".gguf", ".safetensors"]
manual_notes = []

[hosts.local]
kind = "posix"
max_items_per_run = 200
max_gib_per_run = 100
shared_roots = []
roots = []
archive = []
protected = [] # Extra folders never acted on, beyond the built-in OS, personal, cloud-drive and Obsidian vault locations. No globs.
exclude = [] # Paths or globs never archived; an archive match equal to, inside or holding one is dropped.
# An archive entry may also be a table:
# archive = [{ path = "~/projects/*/bench-out", days = 30, backup = "nas", exclude = ["~/projects/keep/bench-out"], approval = true }]
# archive = [{ path = "~/.claude/projects/*/*.jsonl", category = "artifact", preservation = "sha256" }]

# Remote POSIX example. Uncomment and set your SSH destination and paths.
# [hosts.server]
# kind = "posix"
# ssh = "server.example.invalid"
# roots = ["~/projects"]

# Native Windows example.
# [hosts.windows]
# kind = "powershell"
# ssh = "windows.example.invalid"
# roots = ['%USERPROFILE%\REPOS']
