name: verify
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "coldbox"]') }}
    timeout-minutes: 60
    steps:
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork pull requests are not verified on Coldbox." >&2
          exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: coldbox checks
